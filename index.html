<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY TUBE — お気に入り動画</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #ff3c3c;
    --accent2: #ff7043;
    --text: #f0f0f0;
    --muted: #777;
    --radius: 8px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(255,60,60,0.4);
  }
  .logo span { color: var(--text); }
  .header-actions { display: flex; gap: 10px; }

  /* ── Layout ── */
  .app { display: flex; height: calc(100vh - 56px); }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .count-badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .video-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .video-list::-webkit-scrollbar { width: 4px; }
  .video-list::-webkit-scrollbar-track { background: transparent; }
  .video-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .video-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
    margin-bottom: 2px;
  }
  .video-item:hover { background: var(--surface2); }
  .video-item.active {
    background: var(--surface2);
    border-color: var(--accent);
  }
  .thumb-wrap {
    width: 64px;
    min-width: 64px;
    height: 36px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--border);
    position: relative;
  }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: var(--border);
    color: var(--muted);
    font-size: 18px;
  }
  .item-info { flex: 1; overflow: hidden; }
  .item-title {
    font-size: 11px;
    font-weight: 400;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--text);
  }
  .item-tag {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-delete {
    color: var(--muted);
    font-size: 14px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .video-item:hover .item-delete { opacity: 1; }
  .item-delete:hover { color: var(--accent); }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Player area */
  .player-area {
    background: #000;
    position: relative;
  }
  .player-ratio {
    width: 100%;
    padding-top: 56.25%;
    position: relative;
  }
  .player-ratio iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  .no-video {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 12px;
  }
  .no-video .big-icon { font-size: 64px; opacity: 0.2; }
  .no-video p { font-size: 13px; }

  /* Video info bar */
  .video-info-bar {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .current-title {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .current-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Tags filter */
  .tags-bar {
    padding: 10px 16px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tag-btn {
    font-size: 11px;
    font-family: 'Noto Sans JP', sans-serif;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tag-btn:hover, .tag-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,60,60,0.08);
  }

  /* Grid */
  .grid-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .grid-wrap::-webkit-scrollbar { width: 4px; }
  .grid-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .grid-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .grid-card:hover {
    transform: translateY(-2px);
    border-color: #444;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .grid-card.active { border-color: var(--accent); }
  .card-thumb {
    width: 100%;
    padding-top: 56.25%;
    position: relative;
    background: var(--border);
  }
  .card-thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-thumb-placeholder {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 28px;
  }
  .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
    font-size: 36px;
  }
  .grid-card:hover .play-overlay { opacity: 1; }
  .card-body { padding: 10px; }
  .card-title {
    font-size: 12px;
    font-weight: 400;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-tag {
    font-size: 10px;
    color: var(--accent);
    margin-top: 4px;
  }

  /* ── Add Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 440px;
    max-width: 92vw;
    transform: translateY(16px);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    margin-bottom: 20px;
    color: var(--accent);
  }
  .form-group { margin-bottom: 14px; }
  .form-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .form-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--muted); }
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end;
    margin-top: 20px;
  }
  .btn {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 20px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.15s;
  }
  .btn:hover { color: var(--text); border-color: #555; }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #e03030; border-color: #e03030; color: #fff; }
  .btn-icon {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%;
    color: var(--muted);
    gap: 12px;
    text-align: center;
  }
  .empty-state .icon { font-size: 56px; opacity: 0.2; }
  .empty-state p { font-size: 13px; line-height: 1.7; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scrollbar global */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">MY<span>TUBE</span></div>
  <div class="header-actions">
    <button class="btn-icon" onclick="openModal()">＋ 動画を追加</button>
  </div>
</header>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">PLAYLIST</span>
      <span class="count-badge" id="countBadge">0</span>
    </div>
    <div class="video-list" id="videoList"></div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- Player -->
    <div class="player-area">
      <div class="player-ratio" id="playerRatio">
        <div class="no-video" id="noVideo">
          <div class="big-icon">▶</div>
          <p>動画を選択して再生しましょう</p>
        </div>
      </div>
    </div>
    <!-- Info bar -->
    <div class="video-info-bar" id="infoBar" style="display:none">
      <div class="current-title" id="currentTitle">—</div>
      <div class="current-meta" id="currentMeta"></div>
    </div>
    <!-- Tags filter -->
    <div class="tags-bar" id="tagsBar"></div>
    <!-- Grid -->
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
      <div class="empty-state" id="emptyState">
        <div class="icon">🎬</div>
        <p>まだ動画がありません<br>「＋ 動画を追加」から登録しましょう</p>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
  <div class="modal">
    <h2>動画を追加</h2>
    <div class="form-group">
      <label class="form-label">YouTube URL または 動画ID</label>
      <input class="form-input" id="inputUrl" placeholder="https://www.youtube.com/watch?v=..." />
    </div>
    <div class="form-group">
      <label class="form-label">タイトル（省略可）</label>
      <input class="form-input" id="inputTitle" placeholder="動画のタイトル" />
    </div>
    <div class="form-group">
      <label class="form-label">タグ（省略可）</label>
      <input class="form-input" id="inputTag" placeholder="音楽、映画、勉強 など" />
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="addVideo()">追加する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──
let videos = JSON.parse(localStorage.getItem('mytube_videos') || '[]');
let currentId = null;
let activeTag = 'ALL';

function save() {
  localStorage.setItem('mytube_videos', JSON.stringify(videos));
}

// ── YouTube ID抽出 ──
function extractId(input) {
  input = input.trim();
  // すでにIDの場合（11文字英数字）
  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
  const patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /embed\/([a-zA-Z0-9_-]{11})/,
    /shorts\/([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = input.match(p);
    if (m) return m[1];
  }
  return null;
}

function thumbUrl(id) {
  return `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
}

// ── Render ──
function getAllTags() {
  const set = new Set(['ALL']);
  videos.forEach(v => { if (v.tag) set.add(v.tag); });
  return [...set];
}

function filteredVideos() {
  if (activeTag === 'ALL') return videos;
  return videos.filter(v => v.tag === activeTag);
}

function renderTagsBar() {
  const bar = document.getElementById('tagsBar');
  const tags = getAllTags();
  bar.innerHTML = tags.map(t =>
    `<button class="tag-btn${activeTag === t ? ' active' : ''}" onclick="setTag('${t}')">${t}</button>`
  ).join('');
}

function renderSidebar() {
  const list = document.getElementById('videoList');
  const fv = filteredVideos();
  document.getElementById('countBadge').textContent = videos.length;

  if (fv.length === 0) {
    list.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:24px">動画がありません</div>';
    return;
  }
  list.innerHTML = fv.map(v => `
    <div class="video-item${currentId === v.id ? ' active' : ''}" onclick="playVideo('${v.id}')">
      <div class="thumb-wrap">
        <img src="${thumbUrl(v.vid)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="thumb-placeholder" style="display:none">▶</div>
      </div>
      <div class="item-info">
        <div class="item-title">${escHtml(v.title || v.vid)}</div>
        ${v.tag ? `<div class="item-tag">#${escHtml(v.tag)}</div>` : ''}
      </div>
      <button class="item-delete" onclick="deleteVideo(event,'${v.id}')">✕</button>
    </div>
  `).join('');
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const fv = filteredVideos();

  if (fv.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = fv.map(v => `
    <div class="grid-card${currentId === v.id ? ' active' : ''}" onclick="playVideo('${v.id}')">
      <div class="card-thumb">
        <img src="${thumbUrl(v.vid)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="card-thumb-placeholder" style="display:none">▶</div>
        <div class="play-overlay">▶</div>
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(v.title || v.vid)}</div>
        ${v.tag ? `<div class="card-tag">#${escHtml(v.tag)}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function render() {
  renderTagsBar();
  renderSidebar();
  renderGrid();
}

// ── Play ──
function playVideo(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  currentId = id;

  const ratio = document.getElementById('playerRatio');
  const noVideo = document.getElementById('noVideo');
  noVideo && (noVideo.style.display = 'none');

  // Remove old iframe
  const old = ratio.querySelector('iframe');
  if (old) old.remove();

  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube.com/embed/${v.vid}?autoplay=1`;
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  ratio.appendChild(iframe);

  // Info bar
  const infoBar = document.getElementById('infoBar');
  infoBar.style.display = 'block';
  document.getElementById('currentTitle').textContent = v.title || v.vid;
  document.getElementById('currentMeta').textContent = v.tag ? `#${v.tag}` : '';

  render();
  // Scroll to top of main
  document.querySelector('.grid-wrap').scrollTop = 0;
}

// ── Tag ──
function setTag(tag) {
  activeTag = tag;
  render();
}

// ── Add ──
function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('inputUrl').focus();
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('inputUrl').value = '';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputTag').value = '';
}
function closeModalBg(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function addVideo() {
  const url = document.getElementById('inputUrl').value.trim();
  const title = document.getElementById('inputTitle').value.trim();
  const tag = document.getElementById('inputTag').value.trim();

  const vid = extractId(url);
  if (!vid) { showToast('❌ 有効なYouTube URLまたはIDを入力してください'); return; }

  if (videos.find(v => v.vid === vid)) { showToast('⚠️ すでに追加済みです'); return; }

  const id = 'v_' + Date.now();
  videos.unshift({ id, vid, title: title || '', tag: tag || '' });
  save();
  closeModal();
  render();
  showToast('✅ 追加しました！');
}

// ── Delete ──
function deleteVideo(e, id) {
  e.stopPropagation();
  videos = videos.filter(v => v.id !== id);
  if (currentId === id) {
    currentId = null;
    const ratio = document.getElementById('playerRatio');
    const old = ratio.querySelector('iframe');
    if (old) old.remove();
    document.getElementById('noVideo').style.display = 'flex';
    document.getElementById('infoBar').style.display = 'none';
  }
  save();
  render();
  showToast('🗑 削除しました');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) addVideo();
});

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──
render();
</script>
</body>
</html>
